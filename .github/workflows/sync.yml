name: Sincronizar tipo de cambio BCB

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 01:00 America/La_Paz (UTC-4), todos los dias
  workflow_dispatch: {}    # permite correrlo a mano desde la pestana Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrapear BCB y actualizar tipo-cambio.json
        run: python scrape.py

      - name: Commitear si cambio
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add tipo-cambio.json
          git diff --cached --quiet && echo "Sin cambios, no se commitea." || git commit -m "Actualizar tipo de cambio BCB"
          git push
